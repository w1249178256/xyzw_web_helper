
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location = /api/link-games/manifest {
        limit_except GET HEAD POST { deny all; }
        client_max_body_size 64k;
        proxy_pass https://xxz-xyzw.hortorgames.com/login/manifest;
        proxy_ssl_server_name on;
        proxy_set_header Host xxz-xyzw.hortorgames.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 65s;
        proxy_redirect off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        add_header X-Game-Status $upstream_status always;
        add_header X-Game-Location $upstream_http_location always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/link-games/assets/ {
        limit_except GET HEAD { deny all; }
        client_max_body_size 64k;
        proxy_pass https://xxz-xyzw-res.hortorgames.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host xxz-xyzw-res.hortorgames.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 65s;
        proxy_redirect off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        add_header X-Game-Status $upstream_status always;
        add_header X-Game-Location $upstream_http_location always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/link-games/ali-assets/ {
        limit_except GET HEAD { deny all; }
        client_max_body_size 64k;
        proxy_pass https://xxz-xyzw-alires.hortorgames.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host xxz-xyzw-alires.hortorgames.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 65s;
        proxy_redirect off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        add_header X-Game-Status $upstream_status always;
        add_header X-Game-Location $upstream_http_location always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/link-games/wxmini/ {
        limit_except GET HEAD { deny all; }
        client_max_body_size 64k;
        proxy_pass https://wxmini-resource.hortorgames.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host wxmini-resource.hortorgames.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 65s;
        proxy_redirect off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        add_header X-Game-Status $upstream_status always;
        add_header X-Game-Location $upstream_http_location always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/link-games/scripts/ {
        limit_except GET HEAD { deny all; }
        client_max_body_size 64k;
        proxy_pass https://xyzw11001.baby/;
        proxy_ssl_server_name on;
        proxy_set_header Host xyzw11001.baby;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 65s;
        proxy_redirect off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        add_header X-Game-Status $upstream_status always;
        add_header X-Game-Location $upstream_http_location always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root   /app/web;
        try_files $uri $uri/ /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root    /app/web;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

