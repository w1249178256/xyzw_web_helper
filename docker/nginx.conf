# 注意：本配置使用请求期 DNS 解析（resolver + 变量 proxy_pass）。
# 原因：proxy_pass 写死 http://api:3000 时，nginx 在配置加载阶段就解析该主机名，
# 单独运行 web 镜像（无 api 容器）会因解析失败直接退出，导致"一条 docker run"跑不起来。
# 改为请求期解析后：api 不存在时 nginx 正常启动，仅 /api/* 返回 502，前端不受影响。

# resolver_timeout：默认 bridge 网络无 Docker 内嵌 DNS（127.0.0.11 仅用户自定义网络监听），
# 单跑 web 镜像时解析 api 会挂起到默认 30s；设 3s 上限，快速返回 502 而非挂死。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端上游（compose 服务名；请求期解析）
    set $api_upstream http://api:3000;

    # 静态资源：哈希文件名长缓存，html 不缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|css|js|json|woff2?|ttf|bin|atlas)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 后端 API：/api/v1/* 重写为 /api/*（前端 axios baseURL 是 /api/v1）
    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /api/$1 break;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查（后端 /health 为公开路由；URI 原样转发）
    location = /health {
        proxy_pass $api_upstream;
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
