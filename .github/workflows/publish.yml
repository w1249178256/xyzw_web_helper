name: Build and Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构件一：前端（nginx 托管 dist，:latest 方便别人一条命令直接跑）
      # 注意：GHCR 镜像名强制小写，${{ github.repository }} 会带出大写 Owner
      # （SenpeWang），GitHub 表达式无 lower() 函数，故硬编码小写路径。
      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/senpewang/xyzw_web_helper:latest
            ghcr.io/senpewang/xyzw_web_helper:latest-web

      # 构件二：后端（render-backend，仅内网端口，需配合 web 使用）
      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ghcr.io/senpewang/xyzw_web_helper:latest-api
